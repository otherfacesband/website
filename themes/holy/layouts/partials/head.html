<head>
    <!-- required document meta -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- browser tab title -->
    <title>{{ if not .IsHome }}{{ .Title }} - {{ end }}{{ site.Title }}</title>

    <!-- Meta -->
    {{ if eq .Kind "page" }}
    <meta name="description" content="{{ .Summary }}" />
    <meta name="author" content="{{ .Params.Author | default site.Params.author.name }}" />
    {{ else }}
    <meta name="description" content="{{ site.Params.description }}" />
    <meta name="author" content="{{ site.Params.author.name }}" />
    {{ end }}

    <!-- Master CSS: reset stylesheet + the runtime that turns utility classNames into actual CSS in the browser -->
    <link href="https://unpkg.com/@master/normal.css" rel="stylesheet">
    <script src="https://unpkg.com/@master/style@1.5.0"></script>
    <script src="https://unpkg.com/@master/styles@1.13.0"></script>
    <script src="https://unpkg.com/master-styles-group"></script>
    <script src="https://unpkg.com/themes.js"></script>
    <script>window.themes = window.themes || new window.Themes()</script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3FHPWC19NH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-3FHPWC19NH');
    </script>

    <!-- site fonts: Labrada for headers/large display text, Newsreader for smaller body copy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Labrada:wght@100..900&family=Parastoo:wght@400;700&display=swap" rel="stylesheet">
    <style>
:root {
    /* variable name stays --font-sans (not --font-serif) because Master CSS's "font:sans"
       utility, used throughout this theme, is hardcoded to read this exact variable --
       it's the site's default, applied to <body>, so headers and large text get it for free */
    --font-sans: "Labrada", Georgia, Cambria, "Times New Roman", Times, serif;
    /* applied explicitly to smaller/body-copy text (see prose.html, footer.html) */
    --font-text: "Parastoo", Georgia, Cambria, "Times New Roman", Times, serif;
}
    </style>

    <!-- forces dark theme regardless of the visitor's OS preference -->
    {{- partial "head-extra.html" . -}}
</head>
