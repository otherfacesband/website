<!DOCTYPE html>
<html>
{{- partial "head.html" . -}}

<body class="bg:url('\treebonk.jpg') bg:repeat-y bg:cover bg:100% bg:#090302@dark font:fade-16@dark font:sans">
    {{ partial "header.html" . -}}
    <div class="d:flex flex:column@<=sm pt:45 px:24 jc:center gap:44 word-break:break-word">
        {{- block "side" . }}{{- end }}
        <!-- <div class="max-w:700 w:full box:content-box">
            {{- block "main" . }}{{- end }}
            {{- partial "footer.html" . -}}
        </div> -->
        <div class="max-w:700 w:full box:content-box d:flex flex:column min-h:80vh p:16|24 r:8">
            {{- block "main" . }}{{- end }}
            <div class="mt:auto">
                {{- partial "footer.html" . -}}
            </div>
        </div>
    </div>
</body>

</html>
